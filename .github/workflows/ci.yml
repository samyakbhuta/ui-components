name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Type-check, unit tests and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build the package
        run: npm run build:package

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Builds the site, serves it with vite preview, and runs e2e/ in light and dark.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
