name: Release

# Publishes @samyakbhuta/ui-components when a tag like ui-components-v0.1.0-beta.1 is pushed.
# It signs in to npm with trusted publishing (OIDC), so no npm token is stored in the repo.
on:
  push:
    tags: ["ui-components-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Check and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm 11.5.1 or later, which comes with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(node -p 'require("./packages/ui-components/package.json").version')
          if [ "${GITHUB_REF_NAME}" != "ui-components-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package version ${version}."
            exit 1
          fi
          # A version with a hyphen (0.2.0-beta.1) is a prerelease and goes out under the beta tag.
          case "$version" in *-*) echo "tag=beta" >> "$GITHUB_OUTPUT" ;; *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;; esac

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build the package
        run: npm run build:package

      - name: Publish
        working-directory: packages/ui-components
        run: npm publish --tag ${{ steps.version.outputs.tag }}
