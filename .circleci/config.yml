version: 2.1

# Checks run on every push. A tag like ui-components-v0.1.0-beta.1 also publishes
# @samyakbhuta/ui-components to npm with trusted publishing (OIDC), so no npm token is stored.

functions:
  node: github.com/circleci-functions/setup-node@v0.6.0
  playwright: github.com/circleci-functions/setup-playwright@v0.2.0

jobs:
  test:
    docker:
      - image: cimg/base:stable
    environment:
      # setup-playwright installs and caches the browsers, so npm ci doesn't download them.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - checkout
      # Vite 8 needs Node 20.19+ or 22.12+.
      - node:
          with:
            node-version: "22"
      - node/install-packages
      - run:
          name: Type-check
          command: npm run typecheck
      - run:
          name: Build the package
          command: npm run build:package
      # Unit tests: Vitest in jsdom (suite "unit" in .circleci/test-suites.yml).
      - run:
          name: Unit tests
          command: circleci testsuite run "unit"
      - playwright/install:
          with:
            browsers: chromium
      # Browser tests: builds the site, serves it with vite preview, and runs e2e/ in light and dark.
      - run:
          name: Browser tests
          command: circleci testsuite run "e2e"

  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Check the tag matches the package version
          command: |
            version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' packages/ui-components/package.json)
            if [ "$CIRCLE_TAG" != "ui-components-v$version" ]; then
              echo "Tag $CIRCLE_TAG doesn't match package version $version." >&2
              exit 1
            fi
            # A version with a hyphen (0.2.0-beta.1) is a prerelease and goes out under the beta tag.
            case "$version" in *-*) tag=beta ;; *) tag=latest ;; esac
            echo "export NPM_DIST_TAG=$tag" >> "$BASH_ENV"
      # Trusted publishing needs npm 11.5.1 or later, which comes with Node 24.
      - node:
          with:
            node-version: "24"
      - node/install-packages
      - run:
          name: Build the package
          command: npm run build:package
      - run:
          name: Publish
          working_directory: packages/ui-components
          command: |
            npm --version
            # npm swaps this OIDC token for a short-lived publish token and adds provenance.
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
            npm publish --tag "$NPM_DIST_TAG"

workflows:
  checks:
    jobs:
      - test

  release:
    jobs:
      - test:
          filters:
            tags:
              only: /^ui-components-v.*/
            branches:
              ignore: /.*/
      - publish:
          requires:
            - test
          filters:
            tags:
              only: /^ui-components-v.*/
            branches:
              ignore: /.*/
